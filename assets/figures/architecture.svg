 <title>A retry is ordinary. A duplicate mutation is a bug.</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>A retry is ordinary. A duplicate mutation is a bug.</dc:title>
    <dc:description>Reference architecture · solid arrows show intended flow · only the local SQLite transaction and replay contracts are implemented here The authorization boundary precedes tenant-scoped idempotency. The journal is not a queue acknowledgement and does not make external side effects atomic.
Deployment, identity provider, broker, outbox relay, replicas, CDN, and regional recovery remain explicit design work—not claimed infrastructure.</dc:description>
