name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Source and learning site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.13.2 -r requirements-docs.txt -r requirements-browser.txt
      - name: Check syntax and undefined names throughout the repository
        run: ruff check . --select E9,F63,F7,F82
      - name: Validate workflow definitions
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
      - name: Build learning site and check local links
        run: python scripts/build_site.py
      - name: Test reader controls in Chromium
        run: |
          python -m playwright install --with-deps chromium
          node --test tests/site.test.mjs
          python scripts/check_site_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learning-site
          path: _site/
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Python ${{ matrix.python }} scientific regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned scientific dependencies and CPU PyTorch
        run: |
          python -m pip install -r requirements.txt
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip check
      - name: Test examples, scientific invariants, and documented commands
        run: python -m pytest --junitxml=junit.xml --cov=Core-algorithms --cov=Biological-Systems --cov=Environmental --cov=Explore-PyTorch --cov=scripts --cov=studies --cov=biotech --cov-report=term --cov-report=xml
      - name: Reproduce measured-data analysis and figures offline
        if: matrix.python == '3.12'
        run: python -m studies.run --output artifacts/reproduced-results --figures artifacts/reproduced-figures
      - name: Verify facility and execution contracts offline
        if: matrix.python == '3.12'
        run: |
          python -m biotech.facility_demo --directory artifacts/ci-facility --report artifacts/reproduced-results/facility.json
          python -m studies.facility_figures --report artifacts/reproduced-results/facility.json --output artifacts/reproduced-figures
          python -m studies.resource_scheduling --output artifacts/reproduced-results/resource_scheduling.json
          python -m studies.execution_figures --report artifacts/reproduced-results/resource_scheduling.json --output artifacts/reproduced-figures
          python -m studies.data_movement --output artifacts/reproduced-results/data_movement.json
          python -m studies.statistical_validation --output artifacts/reproduced-results/statistical_validation.json
      - name: Verify biotech QC, export, and two-process training
        if: matrix.python == '3.12'
        env:
          GLOO_SOCKET_IFNAME: lo
        run: |
          python -m biotech.qc --output artifacts/reproduced-results/biotech_qc.json
          python -m studies.inference export --output artifacts/inference-bundle
          python -m studies.inference example-input --output artifacts/example-input.csv
          python -m studies.inference predict --bundle artifacts/inference-bundle --input artifacts/example-input.csv
          python -m studies.async_pipeline
          torchrun --nnodes=1 --nproc-per-node=2 --master-addr=127.0.0.1 --master-port=29517 -m studies.distributed_training --ddp --output artifacts/reproduced-results/distributed.json
      - name: Verify pinned protein-model adaptation
        if: matrix.python == '3.12'
        run: |
          python -m pip install -r requirements-protein.txt
          python -m studies.protein_transfer --download --output artifacts/reproduced-results/protein_transfer.json
      - name: Verify pinned retrieval model and precision comparison
        if: matrix.python == '3.12'
        run: |
          python -m studies.evidence_retrieval --download-model --timing-repeats 2 --output artifacts/reproduced-results/evidence_retrieval.json
          python -m studies.retrieval_figures --report artifacts/reproduced-results/evidence_retrieval.json --output artifacts/reproduced-figures
      - name: Require exercise branch coverage
        run: python -m pytest tests/test_learning_lab.py --cov=patient_leakage_lab --cov-branch --cov-fail-under=85 --cov-report=term --cov-report=xml:coverage-lab.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-evidence-python-${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
            coverage-lab.xml
            artifacts/reproduced-results/
            artifacts/reproduced-figures/
          if-no-files-found: error
          retention-days: 14
