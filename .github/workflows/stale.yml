# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '22 20 * * *'

jobs:
  stale:

    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        days-before-stale: 90
        days-before-close: -1
        exempt-issue-labels: 'bug,scientific-correction,help wanted'
        stale-issue-message: 'Is this question still open? A reproduction, source, or updated learning goal would help. Inactivity alone will not close it.'
        stale-pr-message: 'This contribution has been quiet. Please note any blockers; it will not be closed automatically.'
        stale-issue-label: 'no-issue-activity'
        stale-pr-label: 'no-pr-activity'
