name: Run patient-leakage investigation

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Random seed for the synthetic cohort
        default: '42'
        required: true
        type: string

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run the seeded counterexample
        shell: bash
        env:
          EXPERIMENT_SEED: ${{ inputs.seed }}
        run: python Core-algorithms/patient_leakage_lab.py --seed "$EXPERIMENT_SEED" | tee patient-leakage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: patient-leakage-result
          path: patient-leakage.json
          if-no-files-found: error
          retention-days: 14
