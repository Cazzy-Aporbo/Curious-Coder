name: Run patient-leakage investigation

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Random seed for the synthetic cohort
        default: '42'
        required: true
        type: string

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run the seeded counterexample
        shell: bash
        env:
          EXPERIMENT_SEED: ${{ inputs.seed }}
        run: python Core-algorithms/patient_leakage_lab.py --seed "$EXPERIMENT_SEED" | tee patient-leakage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: patient-leakage-result
          path: patient-leakage.json
          if-no-files-found: error
          retention-days: 14
